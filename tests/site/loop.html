<!doctype html><html><head><meta charset="utf-8"><title>loop</title><script>window.WP = [];</script></head><body>
<p>Strona zawiesza się 1,5 s po wczytaniu: busyLoop() blokuje wątek na 40 s.</p>
<script>
  function busyLoop() { var t = Date.now(); while (Date.now() - t < 40000) { Math.sqrt(Math.random()); } }
  window.addEventListener('load', function () { setTimeout(busyLoop, 1500); });
</script>
</body></html>
